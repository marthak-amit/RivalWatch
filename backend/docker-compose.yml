# Postgres, migrations, the API (+ Swagger and the RivalWatch UI pages), the crawl worker, the scheduler, and the browser.
#   everything (a server, or this computer):  docker --context default compose up -d --build
#       .env: BROWSER_SERVER_SECRET=<secret> and BROWSER_WS_URL=ws://browser:3000/<same secret>
#   only the browser (to serve another machine): docker --context default compose up -d --build browser
#   the browser on another computer:          docker --context default compose up -d --build db migrate api scheduler worker
#       (set BROWSER_WS_URL=ws://<that computer's IP>:3000/<secret>)
# Images: rivalwatch-backend:app (api/scheduler/migrate), :worker (crawls, no browser inside), :browser (Chromium).
x-env: &env
  env_file: .env
  environment:
    DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/competitor
    PUBLIC_DIR: /srv/public

x-app: &app
  <<: *env
  build: {context: ., target: app}
  image: rivalwatch-backend:app

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: competitor
    ports: ["5433:5432"]   # for DBeaver/psql on this machine; remove on a server
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d competitor"]
      interval: 3s
      retries: 20

  migrate:
    <<: *app
    command: ["sh", "-c", "alembic upgrade head && python -m competitor_moves.db.site_schema"]
    healthcheck: {disable: true}
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  api:
    <<: *app
    ports: ["${API_PORT:-8031}:8000"]   # http://localhost:8031/docs (Swagger), http://localhost:8031/ (UI)
    volumes:
      - ../public:/srv/public:ro       # the UI's pages, served at /, /login, /app, /admin
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}

  scheduler:
    <<: *app
    command: ["python", "-m", "competitor_moves.workers.scheduler"]
    healthcheck: {disable: true}
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    <<: *env                           # BROWSER_WS_URL in .env says where the browser is
    build: {context: ., target: worker}
    image: rivalwatch-backend:worker
    restart: unless-stopped
    stop_grace_period: 60s             # lets the current job finish
    depends_on:
      migrate: {condition: service_completed_successfully}

  browser:                             # the heavy part: run it on your own computer, the worker connects by IP
    build: {context: ., target: browser}
    image: rivalwatch-backend:browser
    environment:
      BROWSER_SERVER_SECRET: ${BROWSER_SERVER_SECRET:-}
    ports: ["${BROWSER_PORT:-3000}:3000"]   # reachable at ws://<this computer's IP>:3000/<secret>; firewall it to your server
    shm_size: "1gb"                    # headless Chrome needs more shared memory than Docker's 64MB default
    init: true                         # reaps the browser processes the server starts
    restart: unless-stopped

volumes:
  pgdata:
