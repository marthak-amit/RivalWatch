<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard: RivalWatch</title>
<link rel="stylesheet" href="/style.css">
<style>
  /* chart palette: categorical slots 1-2, validated light + dark (scripts/validate_palette.js) */
  :root { --s1:#2a78d6; --s2:#eb6834; --side:#fff; --side-hover:#f1f3f9; --surface-1:var(--card); }
  @media (prefers-color-scheme: dark) { :root { --s1:#3987e5; --s2:#d95926; --side:#12141a; --side-hover:#1d2029; } }

  .shell { min-height:100vh; }
  /* Pinned to the viewport edges (not sticky/100vh) so it can never move or be scrolled, whatever the browser toolbar does */
  .sidebar { background:var(--side); border-right:1px solid var(--line); position:fixed; left:0; top:0; bottom:0; width:260px; z-index:20; display:flex; flex-direction:column; padding:16px 12px; gap:14px; overflow:hidden; overflow:clip; overscroll-behavior:none; }
  .sidebar .logo { padding:2px 8px; }
  .sidebar .qa { display:grid; gap:8px; padding:0 4px; }
  .sidebar .qa .btn { width:100%; justify-content:flex-start; }
  .autocrawl { margin-left:auto; align-self:flex-start; font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--mute); background:var(--card); border:1px solid var(--line); border-radius:99px; padding:5px 12px; white-space:nowrap; }
  .autocrawl::before { content:''; display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--good); margin-right:8px; }
  .navgroup { display:grid; gap:2px; } .navgroup h3 { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); margin:6px 10px 4px; font-weight:700; }
  .nav { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px; border:0; background:none; font:inherit; font-weight:600; color:var(--mute); cursor:pointer; text-align:left; width:100%; }
  .nav:hover { background:var(--side-hover); color:var(--ink); }
  .nav[aria-current=page] { background:var(--acc-soft); color:var(--acc); }
  .nav .cnt { margin-left:auto; font-size:12px; }
  .sidebar .grow { flex:1; min-height:0; }
  #nav { min-height:0; }
  /* Fit the whole sidebar in the viewport at any height: compact in steps instead of scrolling */
  @media (max-height:860px) {
    .sidebar { padding:12px 10px; gap:8px; } .sidebar .qa { gap:6px; } .sidebar .qa .btn { padding:6px 12px; }
    .navgroup { gap:0; } .navgroup h3 { margin:4px 10px 2px; } #nav { gap:6px !important; }
    .nav { padding:6px 10px; } .plancard { padding:8px 10px; } .plancard .row { margin-bottom:2px; } .usercard .av { width:30px; height:30px; }
  }
  @media (max-height:720px) { #sReport { display:none; } .nav { padding:5px 10px; } }
  @media (max-height:600px) { .navgroup h3, .plancard .bar2 { display:none; } .logo { font-size:16px; } .sidebar { gap:6px; } }
  @media (max-height:500px) { .plancard { display:none; } .sidebar .qa .btn { padding:4px 10px; } .nav { padding:4px 10px; } }
  @media (max-height:420px) { .sidebar { overflow-y:auto; } } /* last resort on tiny windows */
  .plancard { border:1px solid var(--line); border-radius:12px; padding:12px; } .plancard .row { margin-bottom:6px; }
  .usercard { display:flex; align-items:center; gap:10px; padding:4px; } .usercard .meta { min-width:0; flex:1; } .usercard .meta b, .usercard .meta span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .av { width:34px; height:34px; border-radius:50%; background:var(--acc-soft); color:var(--acc); display:grid; place-items:center; font-weight:800; flex:none; }
  .iconbtn { border:0; background:none; color:var(--mute); cursor:pointer; padding:6px; border-radius:8px; display:grid; } .iconbtn:hover { background:var(--side-hover); color:var(--ink); }

  .content { min-width:0; margin-left:260px; }
  .topbar { display:flex; align-items:center; gap:12px; padding:18px 28px 6px; }
  .topbar h1 { font-size:24px; } .topbar .sub { color:var(--mute); font-size:14px; }
  #burger { display:none; }
  main { padding:12px 28px 60px; max-width:1180px; }
  .scrim { display:none; }
  @media (max-width:900px) {
    .content { margin-left:0; }
    .sidebar { z-index:40; width:272px; transform:translateX(-102%); visibility:hidden; transition:transform .2s, visibility .2s; }
    body.open .sidebar { transform:none; visibility:visible; box-shadow:0 0 40px rgba(0,0,0,.35); }
    body.open .scrim { display:block; position:fixed; inset:0; background:rgba(8,10,16,.5); z-index:30; }
    #burger { display:grid; } .topbar { padding:14px 16px 4px; } main { padding:10px 16px 50px; }
  }
  @media (prefers-reduced-motion: reduce) { .sidebar { transition:none; } }

  .price { font-variant-numeric:tabular-nums; }
  code, pre { font:13px ui-monospace,Menlo,monospace; } pre { background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:12px; overflow-x:auto; margin:8px 0 0; }
  .planopt { border:2px solid var(--line); border-radius:12px; padding:14px; } .planopt.cur { border-color:var(--acc); }
  .bar2 { height:6px; background:var(--acc-soft); border-radius:9px; overflow:hidden; margin-top:8px; } .bar2 i { display:block; height:100%; background:var(--acc); border-radius:9px; }
  .kpi .v { font-size:30px; font-weight:800; letter-spacing:-.02em; } .kpi .d { font-size:12px; color:var(--mute); margin-top:2px; }
  .seg { display:inline-flex; background:var(--line); border-radius:10px; padding:3px; }
  .seg button { font:inherit; font-weight:600; border:0; background:none; color:var(--mute); padding:6px 14px; border-radius:8px; cursor:pointer; }
  .seg button[aria-pressed=true] { background:var(--card); color:var(--ink); box-shadow:var(--shadow); }
  .controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }

  /* charts */
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--mute); margin-bottom:6px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .chartwrap { position:relative; } svg.chart { width:100%; height:auto; display:block; overflow:visible; }
  .ax { fill:var(--mute); font-size:11px; } .ax.strong { fill:var(--ink); font-weight:700; } .gl { stroke:var(--line); stroke-width:1; }
  .col .hit { fill:transparent; cursor:default; } .col:hover .bar, .col:focus-within .bar, .col.on .bar { filter:brightness(1.14); } .col .hit:focus { outline:none; }
  .col .ring { fill:none; stroke:var(--acc); stroke-width:2; rx:4; opacity:0; } .col:focus-within .ring { opacity:1; }
  .s1 { fill:var(--s1); } .s2 { fill:var(--s2); }
  #tip { position:fixed; z-index:60; pointer-events:none; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.18); display:none; min-width:150px; }
  #tip .t { color:var(--mute); font-size:12px; margin-bottom:4px; } #tip .r { display:flex; align-items:center; gap:8px; justify-content:space-between; } #tip .r b { font-variant-numeric:tabular-nums; }
  #tip .k { display:inline-block; width:10px; height:3px; border-radius:2px; margin-right:6px; vertical-align:middle; }
  .hbar { display:grid; grid-template-columns:120px 1fr; gap:10px; align-items:center; padding:7px 0; } .hbar .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hbar .track { display:flex; align-items:center; gap:2px; height:16px; } .hbar .track i { display:block; height:16px; } .hbar .track i:last-of-type { border-radius:0 4px 4px 0; } .hbar .track i:hover { filter:brightness(1.14); }
  .hbar .track span { margin-left:8px; font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }
  table.t { width:100%; border-collapse:collapse; font-size:14px; } table.t th, table.t td { padding:7px 8px; border-bottom:1px solid var(--line); text-align:left; } table.t td.n, table.t th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .chip { font:inherit; font-weight:600; font-size:13px; padding:5px 12px; border-radius:99px; border:1px solid var(--line); background:var(--card); color:var(--mute); cursor:pointer; }
  .chip:hover { border-color:var(--acc); color:var(--ink); } .chip[aria-pressed=true] { background:var(--acc-soft); border-color:var(--acc); color:var(--acc); }
  .cstats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:14px 0; } .cstats div { background:var(--bg); border-radius:10px; padding:8px 4px; text-align:center; } .cstats b { display:block; font-size:18px; line-height:1.2; } .cstats span { font-size:11px; }
  /* enable/disable switch: green = on, red = off */
  .switch { display:inline-flex; align-items:center; gap:8px; background:none; border:0; padding:2px; cursor:pointer; font:inherit; font-size:13px; font-weight:700; border-radius:99px; color:inherit; white-space:nowrap; }
  .switch .tr { position:relative; width:40px; height:22px; border-radius:99px; background:var(--bad); transition:background .2s; flex:none; }
  .switch .tr::after { content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.35); transition:transform .2s; }
  .switch[aria-checked=true] .tr { background:var(--good); } .switch[aria-checked=true] .tr::after { transform:translateX(18px); }
  .switch .lb { color:#b42318; } .switch[aria-checked=true] .lb { color:#05603a; } .switch.err .lb { color:#b42318; }
  @media (prefers-color-scheme: dark) { .switch .lb, .switch.err .lb { color:#fda29b; } .switch[aria-checked=true] .lb { color:#6ce9a6; } }
  .switch[aria-busy=true] { opacity:.6; pointer-events:none; }
  /* small status icon next to a competitor's name: green = enabled & working, red = disabled or failing */
  .sdot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; vertical-align:middle; flex:none; background:var(--good); box-shadow:0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); transition:background .2s, box-shadow .2s; }
  .sdot.on { animation:sping 2.2s infinite; }
  .sdot.off { background:var(--bad); box-shadow:0 0 0 3px color-mix(in srgb, var(--bad) 28%, transparent); }
  .sdot.wait { background:var(--mute); box-shadow:0 0 0 3px color-mix(in srgb, var(--mute) 25%, transparent); }
  @keyframes sping { 0% { box-shadow:0 0 0 0 color-mix(in srgb, var(--good) 55%, transparent); } 70%, 100% { box-shadow:0 0 0 7px transparent; } }
  @media (prefers-reduced-motion: reduce) { .sdot.on { animation:none; } }
  .dim { opacity:.5; filter:grayscale(.7); transition:opacity .2s; }
  .clamp { display:-webkit-box; -webkit-line-clamp:3; line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .kv { display:grid; grid-template-columns:104px 1fr; gap:8px; padding:6px 0; border-top:1px solid var(--line); font-size:13px; } .kv .k { color:var(--mute); } .kv .v2 { display:flex; flex-wrap:wrap; gap:6px; align-items:center; min-width:0; overflow-wrap:anywhere; }
  a.chip { text-decoration:none; padding:2px 10px; font-size:12px; }
  tr.go { cursor:pointer; } tr.go:hover td { background:var(--acc-soft); }
  .linkbtn { background:none; border:0; color:var(--acc); font:inherit; font-weight:600; cursor:pointer; padding:0; } .linkbtn:hover { text-decoration:underline; }

  @media print {
    .sidebar, .topbar #burger, .noprint, .scrim, #toast { display:none !important; } .content { margin-left:0; } main { padding:0; max-width:none; }
    body { background:#fff; color:#000; } .card { box-shadow:none; break-inside:avoid; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="side" aria-label="Main navigation">
    <a class="logo" href="/">RivalWatch</a>
    <div class="qa">
      <button class="btn primary" id="sCrawl"></button>
      <button class="btn" id="sAdd"></button>
      <button class="btn" id="sReport"></button>
    </div>
    <nav id="nav" style="display:grid;gap:10px"></nav>
    <div class="grow"></div>
    <div class="plancard" id="plan"></div>
    <div class="usercard" id="user"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="content">
    <header class="topbar"><button class="iconbtn" id="burger" aria-label="Open menu"></button><div><h1 id="title"></h1><div class="sub" id="sub"></div></div><span class="autocrawl noprint" id="sNext" title="Time until the next scheduled crawl"></span></header>
    <main id="view"></main>
  </div>
</div>
<div id="tip" role="tooltip"></div>

<script src="/common.js"></script>
<script>
// ---------- icons ----------
const ICONS = {
  overview: 'M3 3h7v9H3z M14 3h7v5h-7z M14 12h7v9h-7z M3 16h7v5H3z', competitors: 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
  changes: 'M22 12h-4l-3 9L9 3l-3 9H2', reports: 'M4 20V10 M10 20V4 M16 20v-7 M22 20H2',
  digests: 'M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z M14 3v6h6 M8 13h8 M8 17h5',
  demo: 'M9 3h6 M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2.2h12.4a1.5 1.5 0 0 0 1.3-2.2L14 9V3',
  account: 'M21 2l-9.6 9.6 M15.5 7.5l3 3L22 7l-3-3 M7.5 11a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z',
  crawl: 'M21 12a9 9 0 0 0-15-6.7L3 8 M3 3v5h5 M3 12a9 9 0 0 0 15 6.7L21 16 M16 16h5v5', plus: 'M12 5v14 M5 12h14',
  logout: 'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4 M16 17l5-5-5-5 M21 12H9', menu: 'M3 6h18 M3 12h18 M3 18h18',
  download: 'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 15V3', printer: 'M6 9V2h12v7 M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2 M6 14h12v8H6z',
  sparkle: 'M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z',
};
const NS = 'http://www.w3.org/2000/svg';
const svg = (tag, attrs = {}, ...kids) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); e.append(...kids.flat().filter((x) => x != null)); return e; };
const icon = (n, size = 18) => svg('svg', { viewBox: '0 0 24 24', width: size, height: size, fill: 'none', stroke: 'currentColor', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' }, svg('path', { d: ICONS[n] }));
const btnI = (n, label, props = {}) => el('button', { class: 'btn', ...props }, icon(n, 16), label);

// ---------- state ----------
const NAV = [['Monitor', [['overview', 'Overview'], ['competitors', 'Competitors'], ['changes', 'Changes']]], ['Insights', [['reports', 'Reports'], ['digests', 'AI digests']]], ['Tools', [['demo', 'Live demo'], ['account', 'Account & API']]]];
const TITLES = { overview: 'Overview', competitors: 'Competitors', changes: 'Changes', reports: 'Reports', digests: 'AI digests', demo: 'Live demo', account: 'Account & API' };
let S = null, ME = null, R = { week: null, month: null }, PLANS = {}, sig = '';
let CAPS = {}; // what the backend supports (everything, in standalone mode)
const can = (k) => CAPS[k] !== false;
let tab = (location.hash || '#overview').slice(1); if (!TITLES[tab]) tab = 'overview';
let selComp = ''; try { selComp = sessionStorage.getItem('rw_comp') || ''; } catch { /* storage may be blocked */ }
let period = 'week', showTable = false, summary = null, summarizing = false, flt = { type: '', comp: '' }, selSite = '', editMsg = 'Pick an edit, then crawl.';
const TYPE_LABEL = { price_change: 'price change', product_added: 'product added', product_removed: 'product removed', new_promo: 'new promo', promo_ended: 'promo ended', new_page: 'new page', page_removed: 'page removed' };
const SERIES = [['product', 'Product & price', 's1', 'var(--s1)'], ['page', 'Pages & promotions', 's2', 'var(--s2)']];
const fmtDay = (d, o) => new Date(d + 'T00:00:00Z').toLocaleDateString('en', { timeZone: 'UTC', ...o });
const fmtTime = (iso) => new Date(iso).toLocaleString('en', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

// ---------- tooltip ----------
const tip = $('tip');
function showTip(x, y, title, rows) {
  tip.replaceChildren(el('div', { class: 't' }, title), ...rows.map(([color, label, val]) => el('div', { class: 'r' }, el('span', {}, color && el('i', { class: 'k', style: 'background:' + color }), label), el('b', {}, String(val)))));
  tip.style.display = 'block';
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x + 14)) + 'px'; tip.style.top = Math.max(8, Math.min(innerHeight - h - 8, y - h - 10)) + 'px';
}
const hideTip = () => { tip.style.display = 'none'; };
function bindTip(node, title, rows) {
  node.addEventListener('pointermove', (e) => showTip(e.clientX, e.clientY, title, rows)); node.addEventListener('pointerleave', hideTip);
  node.addEventListener('focus', () => { const r = node.getBoundingClientRect(); showTip(r.left + r.width / 2, r.top + 40, title, rows); }); node.addEventListener('blur', hideTip);
}

// ---------- charts ----------
const barPath = (x, y, w, h, r) => { r = Math.min(r, h / 2, w / 2); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };
const legend = () => el('div', { class: 'legend' }, SERIES.map(([, name, , color]) => el('span', {}, el('i', { style: 'background:' + color }), name)));

/** Stacked daily columns: product & price (bottom) + pages & promotions (top). */
function columnChart(daily, weekly) {
  const W = 720, H = 250, m = { l: 30, r: 6, t: 20, b: 30 }, iw = W - m.l - m.r, ih = H - m.t - m.b, y0 = m.t + ih;
  const maxV = Math.max(4, ...daily.map((d) => d.product + d.page)); // floor of 4 so a single change isn't a full-height bar
  const step = maxV <= 4 ? 1 : Math.ceil(maxV / 4), top = Math.ceil(maxV / step) * step, unit = ih / top;
  const band = iw / daily.length, bw = Math.min(24, band * 0.62);
  const peak = daily.reduce((b, d, i) => (d.product + d.page > daily[b].product + daily[b].page ? i : b), 0);
  const kids = [];
  for (let v = 0; v <= top; v += step) { const y = y0 - v * unit; kids.push(svg('line', { class: 'gl', x1: m.l, x2: W - m.r, y1: y, y2: y }), svg('text', { class: 'ax', x: m.l - 8, y: y + 4, 'text-anchor': 'end' }, String(v))); }
  daily.forEach((d, i) => {
    const x = m.l + band * i + (band - bw) / 2, total = d.product + d.page, hp = d.product * unit, hg = d.page * unit;
    const g = svg('g', { class: 'col' });
    if (d.product) g.append(svg('path', { class: 'bar s1', d: barPath(x, y0 - hp, bw, hp, d.page ? 0 : 4) }));
    if (d.page) { const gap = d.product ? 2 : 0; g.append(svg('path', { class: 'bar s2', d: barPath(x, y0 - hp - hg, bw, hg - gap, 4) })); }
    if (i === peak && total > 0) g.append(svg('text', { class: 'ax strong', x: x + bw / 2, y: y0 - hp - hg - 6, 'text-anchor': 'middle' }, String(total)));
    const label = fmtDay(d.date, { month: 'short', day: 'numeric' }) + ': ' + total + ' change' + (total === 1 ? '' : 's');
    const hit = svg('rect', { class: 'hit', x: m.l + band * i, y: m.t - 6, width: band, height: ih + 6 + 24, tabindex: 0, role: 'img', 'aria-label': label });
    g.append(svg('rect', { class: 'ring', x: m.l + band * i + 1, y: m.t - 5, width: band - 2, height: ih + 5 }), hit);
    bindTip(hit, fmtDay(d.date, { weekday: 'short', month: 'short', day: 'numeric' }), [...SERIES.map(([k, name, , color]) => [color, name, d[k]]), [null, 'Total', total]]);
    kids.push(g);
    if (weekly || (daily.length - 1 - i) % 5 === 0) kids.push(svg('text', { class: 'ax', x: m.l + band * i + band / 2, y: H - 8, 'text-anchor': 'middle' }, weekly ? fmtDay(d.date, { weekday: 'short', day: 'numeric' }) : fmtDay(d.date, { month: 'short', day: 'numeric' })));
  });
  kids.push(svg('line', { class: 'gl', x1: m.l, x2: W - m.r, y1: y0, y2: y0, style: 'stroke:var(--mute);opacity:.5' }));
  return svg('svg', { class: 'chart', viewBox: `0 0 ${W} ${H}`, role: 'group', 'aria-label': `Changes per day, ${daily[0].date} to ${daily.at(-1).date}` }, kids);
}
function dailyTable(daily) {
  return el('div', { class: 'scroll' }, el('table', { class: 't' }, el('thead', {}, el('tr', {}, el('th', {}, 'Day'), el('th', { class: 'n' }, 'Product & price'), el('th', { class: 'n' }, 'Pages & promotions'), el('th', { class: 'n' }, 'Total'))),
    el('tbody', {}, daily.slice().reverse().map((d) => el('tr', {}, el('td', {}, fmtDay(d.date, { weekday: 'short', month: 'short', day: 'numeric' })), el('td', { class: 'n' }, d.product), el('td', { class: 'n' }, d.page), el('td', { class: 'n' }, d.product + d.page))))));
}
function activityCard(r, { weekly, withTable, linkToReports }) {
  const ch = el('div', { class: 'chartwrap' }, showTable && withTable ? dailyTable(r.daily) : columnChart(r.daily, weekly));

      kpi(r.bySignal.page, 'Pages & promotions', `${r.byType.new_promo || 0} promo · ${r.byType.new_page || 0} new page${(r.byType.new_page || 0) === 1 ? '' : 's'}`), one ? kpi(one.snapshot ? one.snapshot.pages.length : '–', 'Pages tracked', one.name) : kpi(r.crawls.count, 'Crawls run', `${r.crawls.pages} pages scanned · ${r.crawls.withChanges} found changes`)),
    el('div', { style: 'margin-bottom:14px' }, activityCard(r, { weekly, withTable: true })),
    summary && summary.key === sumKey(period) && el('div', { class: 'card', style: 'margin-bottom:14px' }, el('div', { class: 'h-sec' }, `AI summary · ${one ? one.name + ' · ' : ''}${weekly ? 'weekly' : 'monthly'} · ${summary.source === 'claude' ? 'Claude' : 'rule-based'}`), digestBody(summary)),
    el('div', { class: 'grid ' + (one ? 'g1' : 'g2'), style: 'margin-bottom:14px' },
      one ? null : el('div', { class: 'card' }, el('div', { class: 'h-sec' }, 'By competitor'), legend(), compBars(r)),
      el('div', { class: 'card' }, el('div', { class: 'h-sec' }, 'Highlights'),
        el('ul', { class: 'plain' }, r.highlights.map((h) => el('li', {}, h))),
        Object.keys(r.byType).length ? el('div', { style: 'margin-top:10px' }, el('div', { class: 'h-sec' }, 'By type'), el('ul', { class: 'plain' }, Object.entries(r.byType).sort((a, b) => b[1] - a[1]).map(([t, n]) => el('li', { class: 'row between' }, el('span', { class: 'tag ' + t }, TYPE_LABEL[t] || t), el('b', { class: 'price' }, n))))) : null)),
    r.biggestMoves.length ? el('div', { class: 'card' }, el('div', { class: 'h-sec' }, 'Biggest price moves'), el('div', { class: 'scroll' }, el('table', { class: 't' },
      el('thead', {}, el('tr', {}, ['Competitor', 'Plan', 'From', 'To', 'Change'].map((h, i) => el('th', { class: i > 1 ? 'n' : '' }, h)))),
      el('tbody', {}, r.biggestMoves.map((m) => el('tr', {}, el('td', {}, m.competitor), el('td', {}, m.name), el('td', { class: 'n' }, m.from), el('td', { class: 'n' }, m.to), el('td', { class: 'n' }, el('b', {}, (m.pct > 0 ? '+' : '') + m.pct + '%'))))))) ) : null,
    r.hasSample && el('p', { class: 'small mute', style: 'margin-top:12px' }, 'Includes pre-loaded sample history so reports are populated in the demo. Use Reset in Live demo to start fresh.'),
  ];
}

function digests() {
  return S.digests.length ? S.digests.map((d) => el('div', { class: 'card', style: 'margin-bottom:14px' }, el('div', { class: 'h-sec' }, `${fmtTime(d.ts)} · ${d.changeCount} change${d.changeCount === 1 ? '' : 's'} · ${d.source === 'claude' ? 'Claude' : 'rule-based'}`), digestBody(d)))
    : el('div', { class: 'card mute' }, 'No digests yet. A digest is written after every crawl that detects changes.');
}

function demo() {
  return [
    el('p', { class: 'mute', style: 'margin-bottom:14px' }, 'These are test competitor pages only you can edit. Change one, crawl, and watch RivalWatch detect it and write the digest.'),
    S.testSites.length ? el('div', { class: 'card', style: 'margin-bottom:14px' },
      el('div', { class: 'row wrapx' },
        el('select', { id: 'site', class: 'inline', 'aria-label': 'Competitor', onchange: (e) => { selSite = e.target.value; } }, S.testSites.map((t) => el('option', { value: t.id, selected: t.id === selSite }, t.name))),
        ...[['price_drop', 'Cut a price 20%'], ['price_hike', 'Raise top price 15%'], ['add_tier', 'Add new tier'], ['promo', 'Launch promotion'], ['new_page', 'Publish new page']].map(([a, l]) => el('button', { class: 'btn sm', onclick: () => editSite(a) }, l)),
        el('button', { class: 'btn sm', onclick: resetDemo }, 'Reset')),
      el('p', { class: 'small mute', id: 'editmsg', style: 'margin-top:10px' }, editMsg),
      el('div', { class: 'row wrapx small', style: 'margin-top:6px' }, el('span', { class: 'mute' }, 'View the page:'), S.testSites.map((t) => el('a', { href: t.url + 'pricing', target: '_blank', rel: 'noopener' }, t.name))),
      el('div', { style: 'margin-top:12px' }, btnI('crawl', 'Crawl now', { class: 'btn primary', onclick: crawlNow })))
      : el('div', { class: 'card mute', style: 'margin-bottom:14px' }, 'The demo competitors aren\'t loaded. Load three editable test competitors to try change detection without a real site.', el('div', { style: 'margin-top:8px' }, el('button', { class: 'btn sm primary', onclick: resetDemo }, 'Load demo competitors'))),
    el('div', { class: 'grid g2' }, digestCard(), changesCard(6)),
  ];
}

function account() {
  const base = location.origin, key = ME.apiKey;
  return [
    el('div', { class: 'card', style: 'margin-bottom:14px' }, el('div', { class: 'h-sec' }, 'Profile'), el('div', {}, el('b', {}, ME.name), ' · ', ME.email), ME.createdAt && el('div', { class: 'small mute' }, 'Member since ' + new Date(ME.createdAt).toLocaleDateString())),
    el('div', { class: 'h-sec' }, can('planChanges') ? 'Plan (demo checkout, no payment taken)' : 'Plan'),
    !can('planChanges') && el('p', { class: 'small mute', style: 'margin:-4px 0 10px' }, 'Plan changes will be available once billing is connected.'),
    el('div', { class: 'grid g3', style: 'margin-bottom:14px' }, Object.values(PLANS).map((p) => el('div', { class: 'planopt' + (p.id === ME.plan ? ' cur' : '') },
      el('div', { class: 'row between' }, el('b', {}, p.name), p.id === ME.plan && el('span', { class: 'pill acc' }, 'Current')),
      el('div', {}, el('b', { style: 'font-size:22px' }, money(p.price)), el('span', { class: 'mute' }, '/mo')), el('div', { class: 'small mute' }, `${p.competitors} competitors · ${p.credits.toLocaleString()} credits`),
      p.id !== ME.plan && el('button', { class: 'btn sm', style: 'margin-top:10px', disabled: !can('planChanges'), title: can('planChanges') ? '' : 'Plan changes will be available once billing is connected', onclick: () => changePlan(p) }, (p.price > PLANS[ME.plan].price ? 'Upgrade' : 'Downgrade') + ' to ' + p.name)))),
    el('div', { class: 'card' }, el('div', { class: 'h-sec' }, 'Crawl API'), el('p', { class: 'small mute' }, 'SocialCrawl-style endpoints. Each page fetched costs 1 credit.'),
      el('div', { class: 'row wrapx', style: 'margin-top:8px' }, el('code', { id: 'keytxt' }, key.slice(0, 7) + '…••••••••••••'),
        el('button', { class: 'btn sm', onclick: () => { $('keytxt').textContent = key; } }, 'Reveal'), el('button', { class: 'btn sm', onclick: () => navigator.clipboard?.writeText(key).then(() => toast('Copied')) }, 'Copy'), can('rotateKey') && el('button', { class: 'btn sm danger', onclick: rotate }, 'Rotate')),
      el('pre', {}, `curl -H "x-api-key: ${key.slice(0, 7)}…" "${base}/v1/credits/balance"\ncurl -H "x-api-key: …" "${base}/v1/web/scrape?url=https://example.com"\ncurl -X POST -H "x-api-key: …" -H "content-type: application/json" \\\n  ${base}/v1/web/crawl -d '{"url":"https://example.com","max_depth":1,"limit":5}'`))];
}
const VIEWS = { overview, competitors, changes, reports, digests, demo, account };
const SUBS = { overview: () => (curComp() ? curComp().name + ' · ' : '') + (S.lastRun ? 'Last crawl ' + ago(S.lastRun) : 'Baseline crawl running…'), competitors: () => `${S.competitors.length} competitor${S.competitors.length === 1 ? '' : 's'} tracked`, changes: () => `${S.changes.length} detected in total`, reports: () => 'Weekly and monthly competitor activity', digests: () => 'AI-written summaries and actions', demo: () => 'Edit a test page, then crawl', account: () => 'Plan, billing and API access' };

// ---------- actions ----------
async function crawlNow() { if (S.running) return; document.querySelectorAll('#sCrawl').forEach((b) => (b.disabled = true)); toast('Crawling…'); try { await api('/api/crawl', { method: 'POST' }); await refresh(true); toast('Crawl complete'); } catch (e) { toast(e.message); } }
async function editSite(action) { try { const r = await api('/api/test/edit', { method: 'POST', body: { site: $('site').value, action } }); editMsg = 'Edited: ' + r.edited + '. Now press “Crawl now”.'; $('editmsg').textContent = editMsg; } catch (e) { toast(e.message); } }
async function resetDemo() { editMsg = 'Reset to baseline.'; toast('Resetting…'); await api('/api/test/reset', { method: 'POST' }); summary = null; await refresh(true); toast('Demo reset'); }
async function addComp(e) { e.preventDefault(); $('cerr').textContent = ''; try { await api('/api/competitors', { method: 'POST', body: { name: $('cn').value, url: $('cu').value } }); toast('Added. Baseline crawl started.'); await refresh(true); setTimeout(() => refresh(true), 2000); } catch (x) { $('cerr').textContent = x.message; } }
async function removeComp(c) { if (!confirm(`Stop monitoring ${c.name}?`)) return; await api('/api/competitors/' + c.id, { method: 'DELETE' }); await refresh(true); }
async function changePlan(p) { await api('/api/me/plan', { method: 'POST', body: { plan: p.id } }); toast('Switched to ' + p.name); await refresh(true); }
async function rotate() { if (!confirm('Rotate the API key? The old key stops working.')) return; await api('/api/me/rotate-key', { method: 'POST' }); await refresh(true); toast('New key issued'); }
async function genSummary(p = period) { summarizing = true; paintView(); try { summary = { key: sumKey(p), ...(await api('/api/reports/summary', { method: 'POST', body: { period: p, competitor: selComp } })) }; } catch (e) { toast(e.message); } summarizing = false; paintView(); }
function exportCsv(r) {
  const safe = (v) => { v = String(v ?? ''); if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
  const rows = [['date', 'competitor', 'type', 'description', 'sample'], ...r.changes.map((c) => [c.ts, c.competitor, c.type, c.label, c.sample])];
  const a = el('a', { href: URL.createObjectURL(new Blob([rows.map((x) => x.map(safe).join(',')).join('\n')], { type: 'text/csv' })), download: `rivalwatch-${r.period}ly-${r.to}.csv` });
  document.body.append(a); a.click(); a.remove(); toast('CSV downloaded');
}
const go = (t) => { if (t === 'demo' && !can('demo')) t = 'overview'; tab = t; location.hash = t; document.body.classList.remove('open'); paintShell(); paintView(); window.scrollTo(0, 0); };

// ---------- shell ----------
function renderNav() { // the Live demo tab only exists when demo competitors are enabled (real accounts see real data only)
  $('nav').replaceChildren(...NAV.map(([group, items]) => el('div', { class: 'navgroup' }, el('h3', {}, group),
    items.filter(([k]) => k !== 'demo' || can('demo')).map(([k, label]) => el('button', { class: 'nav', 'data-k': k, onclick: () => go(k) }, icon(k), label, k === 'changes' && el('span', { class: 'cnt pill', id: 'cnt' }))))));
  document.querySelectorAll('.nav').forEach((b) => b.toggleAttribute('aria-current', false) || (b.dataset.k === tab && b.setAttribute('aria-current', 'page')));
}
function buildNav() {
  renderNav();
  $('sCrawl').append(icon('crawl', 16), el('span', { id: 'sCrawlT' }, 'Crawl now')); $('sCrawl').onclick = crawlNow;
  $('sAdd').append(icon('plus', 16), 'Add competitor'); $('sAdd').onclick = () => { go('competitors'); setTimeout(() => $('cn')?.focus(), 50); };
  $('sReport').append(icon('reports', 16), 'Weekly report'); $('sReport').onclick = () => { period = 'week'; go('reports'); };
  $('burger').append(icon('menu', 22)); $('burger').onclick = () => document.body.classList.toggle('open'); $('scrim').onclick = () => document.body.classList.remove('open');
}
function paintShell() {
  document.querySelectorAll('.nav').forEach((b) => b.toggleAttribute('aria-current', false) || (b.dataset.k === tab && b.setAttribute('aria-current', 'page')));
  $('title').textContent = TITLES[tab]; document.title = TITLES[tab] + ': RivalWatch';
  if (!S) return;
  tickTimer();
  $('sub').textContent = SUBS[tab]();
  $('sCrawl').disabled = S.running; $('sCrawlT').textContent = S.running ? 'Crawling…' : 'Crawl now';
  $('cnt').textContent = S.changes.length;
  const pct = Math.max(0, Math.min(100, S.credits / S.plan.credits * 100));
  $('plan').replaceChildren(el('div', { class: 'row between' }, el('b', {}, S.plan.name + ' plan'), el('button', { class: 'linkbtn small', onclick: () => go('account') }, 'Upgrade')),
    el('div', { class: 'small mute' }, `${S.credits.toLocaleString()} / ${S.plan.credits.toLocaleString()} credits`), el('div', { class: 'bar2' }, el('i', { style: `width:${pct}%` })));
  $('user').replaceChildren(el('div', { class: 'av' }, ME.name.split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase()),
    el('div', { class: 'meta' }, el('b', {}, ME.name), el('span', { class: 'small mute' }, ME.email)), el('button', { class: 'iconbtn', 'aria-label': 'Sign out', title: 'Sign out', onclick: logout }, icon('logout')));
}
function paintView() { hideTip(); $('view').replaceChildren(...[VIEWS[tab]()].flat(Infinity).filter(Boolean)); paintShell(); }
async function refresh(force) {
  S = await api('/api/state');
  if (selComp && !S.competitors.some((c) => c.id === selComp)) selComp = '';
  const q = '&competitor=' + encodeURIComponent(selComp);
  [ME, R.week, R.month] = await Promise.all([api('/api/me'), api('/api/reports?period=week' + q), api('/api/reports?period=month' + q)]);
  const next = [selComp, S.runs, S.running, S.changes.length, S.competitors.length, S.credits, S.digest?.ts, ME.plan, S.competitors.map((c) => c.snapshots + (c.error || '') + c.enabled).join()].join('|');
  const typing = ['cn', 'cu', 'site', 'fType', 'fComp', 'fComp2'].includes(document.activeElement?.id);
  paintShell();
  if (force || (next !== sig && !typing)) { sig = next; paintView(); }
}
function tickTimer() {
  if (!S) return;
  let next = S.nextRun; const step = S.intervalSec * 1000;
  while (next <= Date.now()) next += step; // roll into the next cycle without waiting for the next poll
  const t = Math.round((next - Date.now()) / 1000);
  $('sNext').textContent = `Auto-crawl: ${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
}
setInterval(tickTimer, 1000);
setInterval(() => { if (!document.hidden) refresh().catch(() => {}); }, 5000);
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (TITLES[t] && t !== tab) go(t); });
buildNav(); paintShell();
api('/api/plans', { noRedirect: true }).then((d) => { d.plans.forEach((p) => PLANS[p.id] = p); CAPS = d.backend || {}; if (tab === 'demo' && !can('demo')) tab = 'overview'; renderNav(); return refresh(true); });
</script>
</body>
