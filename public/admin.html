<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin: RivalWatch</title>
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
<style>
  header.bar { background:#1b1d2b; color:#fff; } header.bar .wrap { display:flex; align-items:center; justify-content:space-between; height:58px; gap:12px; flex-wrap:wrap; }
  header.bar .logo { color:#fff; } header.bar .btn { background:transparent; color:#fff; border-color:#3b3f55; } header.bar .themebtn { background:transparent; color:#cbd0e0; border-color:#3b3f55; } header.bar .themebtn:hover { color:#fff; }
  main { padding:22px 0 60px; }
  .dist { display:flex; height:12px; border-radius:99px; overflow:hidden; background:var(--line); margin:10px 0 8px; }
  .dist i { display:block; height:100%; } .lg { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; } .lg b { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; }
  .c-starter { background:#94a3b8; } .c-pro { background:var(--acc); } .c-business { background:#06b6d4; }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; } .toolbar input { max-width:280px; } .toolbar select { width:auto; }
  .av { width:32px; height:32px; border-radius:50%; background:var(--acc-soft); color:var(--acc); display:grid; place-items:center; font-weight:800; flex:none; }
  td .acts { display:flex; gap:6px; flex-wrap:wrap; min-width:250px; max-width:340px; } td .acts .btn, td .small { white-space:nowrap; }
  .meter { width:90px; height:5px; background:var(--line); border-radius:9px; overflow:hidden; margin-top:4px; } .meter i { display:block; height:100%; background:var(--acc); }
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <div class="row"><a class="logo" href="/">RivalWatch</a><span class="pill" style="background:#3b3f55;color:#fff">Admin</span></div>
  <div class="row wrapx"><span data-theme-slot></span><span class="small" id="who" style="opacity:.8"></span><a class="btn sm" href="/app">My dashboard</a><button class="btn sm" id="out">Sign out</button></div>
</div></header>

<main class="wrap">
  <div class="row between wrapx" style="margin-bottom:14px"><h1 style="font-size:24px">User management</h1><button class="btn primary" id="add">+ Add user</button></div>
  <div class="grid g4" id="kpis" style="margin-bottom:14px"></div>
  <div class="card" style="margin-bottom:14px"><div class="h-sec">Active customers by plan</div><div class="dist" id="dist"></div><div class="lg" id="legend"></div></div>

  <div class="card" style="margin-bottom:14px">
    <div class="toolbar">
      <input id="q" type="search" placeholder="Search name or email" aria-label="Search users">
      <select id="fplan" aria-label="Plan filter"><option value="">All plans</option></select>
      <select id="fstatus" aria-label="Status filter"><option value="">All statuses</option><option value="active">Active</option><option value="suspended">Suspended</option></select>
    </div>
    <div class="scroll"><table><thead><tr><th>User</th><th>Role</th><th>Plan</th><th>Status</th><th>Usage</th><th>Last login</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
    <p class="mute small" id="empty" hidden style="padding:14px">No users match.</p>
  </div>

  <div class="card"><div class="h-sec">Audit log</div><ul class="plain" id="audit"></ul></div>
</main>

<dialog id="dlg"><form method="dialog" id="uform" class="stack" novalidate>
  <h2 style="font-size:20px">Add user</h2>
  <div><label for="un">Name</label><input id="un"></div>
  <div><label for="ue">Email</label><input id="ue" type="email"></div>
  <div><label for="up">Temporary password</label><input id="up" type="text" minlength="8" placeholder="At least 8 characters"></div>
  <div class="grid g2" style="gap:10px"><div><label for="upl">Plan</label><select id="upl"></select></div><div><label for="ur">Role</label><select id="ur"><option value="user">User</option><option value="admin">Admin</option></select></div></div>
  <p class="err" id="uerr" role="alert"></p>
  <div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="ucancel">Cancel</button><button class="btn primary" id="usave">Create user</button></div>
</form></dialog>

<script src="/common.js"></script>
<script>
let PLANS = {}, ME = null, users = [], CAPS = {}; // CAPS: what the backend supports (all true in standalone mode)
const can = (k) => CAPS[k] !== false;
const feat = (k) => CAPS.enabled === true && CAPS[k] !== false; // only a backend that serves the full /api/* contract has these
const fmtDur = (sec) => sec >= 3600 ? Math.round(sec / 360) / 10 + ' h' : Math.max(1, Math.round(sec / 60)) + ' min';

const initials = (n) => n.split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();
const kpi = (v, l) => el('div', { class: 'card kpi' }, el('div', { class: 'v' }, String(v)), el('div', { class: 'l' }, l));

async function loadStats() {
  const s = await api('/api/admin/stats');
  $('dist').parentElement.hidden = !s.byPlan; // plan mix and revenue need plan data the backend doesn't expose yet
  $('kpis').replaceChildren(kpi(s.total, 'Total users'), kpi(s.active, 'Active'), kpi(s.suspended, 'Suspended'), s.byPlan ? kpi(money(s.mrr), 'Monthly recurring revenue') : kpi(s.activeNow ?? 0, 'Signed in now'));
  if (!s.byPlan) return;
  const tot = Object.values(s.byPlan).reduce((a, b) => a + b, 0) || 1;
  $('dist').replaceChildren(...Object.entries(s.byPlan).map(([k, n]) => el('i', { class: 'c-' + k, style: `width:${n / tot * 100}%`, title: `${PLANS[k].name}: ${n}` })));
  $('legend').replaceChildren(...Object.entries(s.byPlan).map(([k, n]) => el('span', {}, el('b', { class: 'c-' + k }), `${PLANS[k].name}: ${n}`)));
}

async function loadUsers() {
  const qs = new URLSearchParams({ q: $('q').value, plan: $('fplan').value, status: $('fstatus').value });
  users = (await api('/api/admin/users?' + qs)).users;
  $('empty').hidden = users.length > 0;
  $('rows').replaceChildren(...users.map(rowFor));
}

function rowFor(u) {
  const self = u.id === ME.id;
  const planSel = u.plan === null || !can('adminPlanEdit') ? el('span', { class: u.plan ? 'pill' : 'mute' }, u.plan ? PLANS[u.plan]?.name ?? u.plan : '—') : el('select', { class: 'inline', 'aria-label': 'Plan for ' + u.email, onchange: (e) => patch(u, { plan: e.target.value }, `${u.name} moved to ${PLANS[e.target.value].name}`) },
    Object.values(PLANS).map((p) => el('option', { value: p.id, selected: p.id === u.plan }, p.name)));
  const hasUsage = u.credits !== null && u.credits !== undefined;
  const pct = hasUsage ? Math.max(0, Math.min(100, u.credits / u.creditLimit * 100)) : 0;
  return el('tr', {},
    el('td', {}, el('div', { class: 'row' }, el('div', { class: 'av' }, initials(u.name)), el('div', {}, el('b', {}, u.name + (self ? ' (you)' : '')), el('div', { class: 'small mute' }, u.email)))),
    el('td', {}, el('span', { class: 'pill' + (u.role === 'admin' ? ' acc' : '') }, u.role)),
    el('td', {}, planSel),
    el('td', {}, el('span', { class: 'pill ' + (u.status === 'active' ? 'good' : 'bad') }, u.status), u.activeNow && el('span', { class: 'pill good', style: 'margin-left:6px' }, '● online')),
    hasUsage ? el('td', {}, el('div', { class: 'small', style: 'white-space:nowrap' }, `${u.competitors ?? 0} sites · ${u.credits.toLocaleString()} credits`), el('div', { class: 'meter' }, el('i', { style: `width:${pct}%` })))
      : el('td', { class: 'small', style: 'white-space:nowrap' }, `${u.sessions ?? 0} session${u.sessions === 1 ? '' : 's'} · ${fmtDur(u.totalSessionSec ?? 0)}`),
    el('td', { class: 'small mute' }, ago(u.lastLoginAt)),
    el('td', {}, el('div', { class: 'acts' },
      el('button', { class: 'btn sm', disabled: self && u.status === 'active', onclick: () => patch(u, { status: u.status === 'active' ? 'suspended' : 'active' }, `${u.name} ${u.status === 'active' ? 'suspended' : 'reactivated'}`) }, u.status === 'active' ? 'Suspend' : 'Reactivate'),
      can('adminRoleEdit') && el('button', { class: 'btn sm', disabled: self, onclick: () => patch(u, { role: u.role === 'admin' ? 'user' : 'admin' }, `${u.name} is now ${u.role === 'admin' ? 'a user' : 'an admin'}`) }, u.role === 'admin' ? 'Make user' : 'Make admin'),
      can('adminResetCredits') && el('button', { class: 'btn sm', onclick: () => post(`/api/admin/users/${u.id}/reset-credits`, {}, 'Credits reset') }, 'Reset credits'),
      can('adminResetPassword') && el('button', { class: 'btn sm', onclick: () => resetPw(u) }, 'Set password'),
      feat('adminStore') && u.role !== 'admin' && el('button', { class: 'btn sm', onclick: () => openStore(u) }, 'Store'),
      el('button', { class: 'btn sm danger', disabled: self, onclick: () => del(u) }, 'Delete'))));
}

async function run(fn, ok) { try { await fn(); if (ok) toast(ok); } catch (e) { toast(e.message); } await refresh(); }
const patch = (u, body, ok) => run(() => api('/api/admin/users/' + u.id, { method: 'PATCH', body }), ok);
const post = (path, body, ok) => run(() => api(path, { method: 'POST', body }), ok);
const del = (u) => confirm(`Delete ${u.email}? This removes their account and workspace.`) && run(() => api('/api/admin/users/' + u.id, { method: 'DELETE' }), 'User deleted');
function resetPw(u) {
  const pw = prompt(`New temporary password for ${u.email} (min 8 characters). Their sessions will be signed out.`);
  if (pw) post(`/api/admin/users/${u.id}/reset-password`, { password: pw }, 'Password updated');
}

// ---- a customer's own (Magento) store: the admin can connect and manage it for them -------------------------------
const CRONS = [['0 2 * * *', 'Every day at 02:00 UTC'], ['0 */12 * * *', 'Every 12 hours'], ['0 */6 * * *', 'Every 6 hours'], ['0 * * * *', 'Every hour']];
function openStore(u) {
  const base = `/api/admin/users/${u.id}/store`;
  const body = el('div', { class: 'mb' }, el('span', { class: 'mute' }, 'Loading…'));
  const dlg = el('dialog', { class: 'modal', 'aria-label': 'Store for ' + u.email }, el('form', { method: 'dialog' },
    el('div', { class: 'mh' }, el('div', {}, el('b', { style: 'font-size:16px' }, 'Store: ' + u.name), el('div', { class: 'small mute' }, u.email)), el('button', { class: 'iconbtn', type: 'button', 'aria-label': 'Close', onclick: () => dlg.close() }, '✕')),
    body));
  dlg.addEventListener('close', () => dlg.remove()); document.body.append(dlg); dlg.showModal();
  let timer;
  const load = async () => { clearTimeout(timer); try { paint((await api(base)).store); } catch (e) { body.replaceChildren(el('p', { class: 'err' }, e.message)); } };
  const act = async (fn, ok) => { try { await fn(); if (ok) toast(ok); } catch (e) { toast(e.message); } await load(); await refresh(); };
  function form(s) {
    const err = el('p', { class: 'err', role: 'alert' });
    const url = el('input', { type: 'url', placeholder: 'https://shop.example.com', value: s?.url || '', readonly: !!s }), code = el('input', { placeholder: 'default', value: s?.storeCode || '' });
    const token = el('input', { type: 'password', autocomplete: 'off', placeholder: s?.hasToken ? 'Stored. Enter a new one to replace it.' : 'Optional' });
    const drop = s?.hasToken ? el('input', { type: 'checkbox' }) : null;
    const cron = el('select', {}, CRONS.map(([v, t]) => el('option', { value: v, selected: (s?.cron || CRONS[0][0]) === v }, t)));
    if (s?.cron && !CRONS.some(([v]) => v === s.cron)) cron.prepend(el('option', { value: s.cron, selected: true }, s.cron));
    const save = el('button', { class: 'btn primary', type: 'submit' }, s ? 'Save' : 'Connect & sync');
    return el('form', { class: 'stack', novalidate: true, onsubmit: async (e) => {
      e.preventDefault(); err.textContent = ''; save.disabled = true;
      const b = { cron: cron.value }; if (!s) b.url = url.value.trim(); if (code.value.trim() || s) b.storeCode = code.value.trim() || null;
      if (drop?.checked) b.token = ''; else if (token.value) b.token = token.value;
      try { paint((await api(base, { method: s ? 'PATCH' : 'PUT', body: b })).store); toast(s ? 'Store settings saved' : 'Store connected'); refresh(); } catch (x) { err.textContent = x.message; save.disabled = false; }
    } },
      el('div', {}, el('label', {}, 'Store URL'), url), el('div', { class: 'fgrid' }, el('div', {}, el('label', {}, 'Store view code'), code), el('div', {}, el('label', {}, 'Sync schedule (UTC)'), cron)),
      el('div', {}, el('label', {}, 'Access token'), token, el('div', { class: 'fhint' }, 'Optional. Stored encrypted and never shown again.'), drop && el('label', { class: 'chk' }, drop, 'Remove the stored token')),
      err, el('div', { class: 'row' }, save, s && el('button', { class: 'btn', type: 'button', onclick: () => paint(s, true) }, 'Cancel')));
  }
  function paint(s, view) {
    clearTimeout(timer); if (s?.syncing) timer = setTimeout(load, 3000);
    if (!s) return body.replaceChildren(el('p', { class: 'small mute' }, 'No store is connected for this customer. Connect their Magento shop so their catalogue is read and compared.'), form(null));
    if (s && view === 'edit') return body.replaceChildren(form(s));
    const row = (k, v) => el('div', { class: 'kv' }, el('span', { class: 'k' }, k), el('span', { class: 'v2' }, v));
    body.replaceChildren(...[
      el('div', { class: 'row between wrapx' }, el('div', {}, el('b', {}, s.name || s.url), el('div', { class: 'small' }, s.url)),
        s.syncing ? el('span', { class: 'pill acc' }, 'Syncing…') : s.enabled === false ? el('span', { class: 'pill' }, 'Paused') : el('span', { class: 'pill ' + (s.status === 'error' ? 'bad' : 'good') }, s.status === 'error' ? 'Error' : 'Connected')),
      s.status === 'error' && s.error && el('p', { class: 'err' }, s.error),
      el('div', {}, row('Products', (s.productCount ?? 0).toLocaleString() + (s.currency ? ' · ' + s.currency : '')), row('Last sync', s.lastSync ? ago(s.lastSync) : 'Not yet'), row('Next sync', s.nextSync ? new Date(s.nextSync).toLocaleString() : '–'),
        row('Schedule', (CRONS.find(([v]) => v === s.cron) || [, s.cron || '–'])[1]), row('Access token', s.hasToken ? 'Stored (encrypted)' : 'None')),
      el('div', { class: 'row wrapx' },
        el('button', { class: 'btn primary', type: 'button', disabled: !!s.syncing, onclick: () => act(() => api(base + '/sync', { method: 'POST' }), 'Sync started') }, 'Sync now'),
        el('button', { class: 'btn', type: 'button', onclick: () => paint(s, 'edit') }, 'Edit'),
        el('button', { class: 'btn', type: 'button', onclick: () => act(() => api(base, { method: 'PATCH', body: { enabled: s.enabled === false } }), s.enabled === false ? 'Sync resumed' : 'Sync paused') }, s.enabled === false ? 'Resume' : 'Pause'),
        el('span', { style: 'flex:1' }), el('button', { class: 'btn danger', type: 'button', onclick: () => confirm(`Disconnect ${u.email}'s store? Its synced data is deleted.`) && act(() => api(base, { method: 'DELETE' }), 'Store disconnected') }, 'Disconnect'))].filter(Boolean));
  }
  load();
}

async function loadAudit() {
  const { audit } = await api('/api/admin/audit');
  $('audit').replaceChildren(...(audit.length ? audit.slice(0, 15).map((a) => el('li', { class: 'small' },
    el('b', {}, a.actor), ' ', a.action.replace('_', ' '), a.target && a.target !== a.actor ? [' → ', el('b', {}, a.target)] : '', a.detail && el('span', { class: 'mute' }, ' ' + a.detail), el('span', { class: 'mute' }, ' · ' + ago(a.ts))))
    : [el('li', { class: 'mute small' }, 'No admin actions yet.')]));
}
const refresh = () => Promise.all([loadStats(), loadUsers(), loadAudit()]);

// add-user dialog
$('add').onclick = () => { $('uform').reset(); $('uerr').textContent = ''; $('dlg').showModal(); };
$('ucancel').onclick = () => $('dlg').close();
$('uform').addEventListener('submit', async (e) => {
  e.preventDefault(); $('uerr').textContent = '';
  try { await api('/api/admin/users', { method: 'POST', body: { name: $('un').value, email: $('ue').value, password: $('up').value, plan: $('upl').value, role: $('ur').value } }); $('dlg').close(); toast('User created'); refresh(); }
  catch (x) { $('uerr').textContent = x.message; }
});
let t; $('q').oninput = () => { clearTimeout(t); t = setTimeout(loadUsers, 200); };
$('fplan').onchange = $('fstatus').onchange = loadUsers;
$('out').onclick = logout;

(async () => {
  const info = await api('/api/plans');
  ME = await api('/api/me'); CAPS = info.backend || {};
  PLANS = Object.fromEntries(info.plans.map((p) => [p.id, p]));
  if (!can('adminPlanEdit')) { $('fplan').hidden = true; $('upl').closest('div').hidden = true; }   // plan isn't known/editable via the backend yet
  if (CAPS.signupName === false) $('un').closest('div').hidden = true;                                // the backend doesn't store names yet
  if (!can('adminRoleEdit')) $('ur').closest('div').hidden = true;                                  // admins are created in the database only
  $('who').textContent = ME.email;
  Object.values(PLANS).forEach((p) => { $('fplan').add(new Option(p.name, p.id)); $('upl').add(new Option(p.name + ' · ' + money(p.price), p.id)); });
  refresh();
  setInterval(() => { if (!document.hidden && !$('dlg').open) refresh().catch(() => {}); }, 8000);
})();
</script>
</body>
</html>
